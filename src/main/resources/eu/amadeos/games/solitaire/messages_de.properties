dialog.about.rules=Bauen Sie die vier Ablagestapel vom Ass bis zum König auf, jeden in einer Farbe. In den sieben Reihen werden Karten absteigend in wechselnden Farben angelegt, und nur ein König darf eine leere Reihe füllen. Ein Klick auf den Stapel deckt Karten auf; Karten werden mit der Maus gezogen, ein Doppelklick schickt eine Karte auf ihren Ablagestapel.
